name: VPS Image

on:
  push:
    branches: [vps]
    paths:
      - Dockerfile
      - lib/**
      - '!lib/**/*.test.ts'
      - .github/workflows/vps-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Chromium image for VPS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:vps-latest
            ghcr.io/${{ github.repository }}:vps-${{ github.sha }}
          cache-from: type=gha,scope=rsshub-vps-amd64
          cache-to: type=gha,mode=max,scope=rsshub-vps-amd64
